# Catalog of knowledge base documents. This file is the single source of truth for:
#   - the document stubs under content/ (one per kind: doc entry),
#   - the Google Sheet templates under templates/sheets/ (kind: sheet entries),
#   - the collection checklist in docs/upload-checklist.md and docs/upload-checklist.csv.
# Regenerate with: ictkb scaffold
#
# Fields
#   id      document id (also the file name for kind: doc)
#   kind    doc (Markdown written by the owner) | sheet (rows synced from Google Sheets)
#   tier    realtime | daily | semester | static
#   prio    P0 (needed for the core chatbot) | P1 (needed for a complete bot) | P2 (nice to have)
#   who     office or role that holds the information
#   asks    questions that the written answer must cover (kind: doc only)
#   give    files to upload. Prefix D document, I image, S spreadsheet, Q ask the office, W website
#   golden  golden question ids that depend on this document

- id: about-university-overview
  category: about
  title: ICT University overview, mission and accreditation
  tier: static
  prio: P1
  who: Administration
  asks:
    - When was ICT University founded and by whom?
    - What are the mission, vision and core values?
    - Which accreditations and official recognitions does the university hold?
    - In which countries and cities does ICT University operate, and what is the role of the Yaounde campus?
    - Who are the current leaders (rector, deans) and what are their titles?
  give:
    - "D|Institutional brochure or prospectus (PDF)"
    - "W|History, mission and accreditation pages (collected automatically from the website)"

- id: about-contacts
  category: about
  title: Official contacts and opening hours
  tier: semester
  prio: P0
  who: Administration
  golden: [PPL-04]
  asks:
    - What is the official postal address of the university?
    - What are the general phone number and the general email address?
    - What are the official social media accounts?
    - What are the opening hours of the campus and of the administration offices?
  give:
    - "I|Photo of the official signboard or letterhead showing the contact details"
    - "Q|Confirm in writing that the listed numbers are official office lines"

- id: about-academic-regulations
  category: about
  title: Academic regulations (grading, attendance, exams, conduct)
  tier: semester
  prio: P0
  who: Registrar
  golden: [PRC-16, PRC-17]
  asks:
    - What is the grading scale and the grade point value of each grade?
    - How are the semester GPA and the cumulative GPA calculated?
    - What is the minimum attendance required to sit examinations?
    - What are the examination rules and the penalties for misconduct?
    - What is the pass mark, and what are the rules on probation and dismissal?
    - What are the rules of student conduct and the disciplinary procedure?
  give:
    - "D|Student handbook or academic regulations, complete and current (PDF or DOCX)"

- id: about-academic-calendar
  category: about
  title: Academic calendar for the current year
  tier: semester
  prio: P0
  who: Registrar
  golden: [ANN-02]
  asks:
    - What are the start and end dates of each semester?
    - What are the examination and resit periods?
    - What are the registration and late-registration windows?
    - Which public holidays and closure days apply?
  give:
    - "D|Official signed academic calendar (PDF) to confirm the version on the website"
    - "I|Calendar poster displayed on campus, if one exists"

