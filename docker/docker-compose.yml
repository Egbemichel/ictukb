# Local stack: PostgreSQL with pgvector, the API, and an on-demand pipeline container.
#   docker compose -f docker/docker-compose.yml up -d db api
#   docker compose -f docker/docker-compose.yml run --rm pipeline migrate
#   docker compose -f docker/docker-compose.yml run --rm pipeline index
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ictkb
      POSTGRES_PASSWORD: ictkb
      POSTGRES_DB: ictkb
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ictkb"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://ictkb:ictkb@db:5432/ictkb
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  pipeline:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.pipeline
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://ictkb:ictkb@db:5432/ictkb
    volumes:
      - ../content:/app/content
      - ../incoming:/app/incoming
      - ../docs:/app/docs
    depends_on:
      db:
        condition: service_healthy

  whatsapp:
    profiles: ["whatsapp"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.whatsapp
    environment:
      KB_API_URL: http://api:8000
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      AUTH_STORE: remote
    depends_on:
      - api
    restart: unless-stopped

volumes:
  dbdata:
