name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ictkb
          POSTGRES_PASSWORD: ictkb
          POSTGRES_DB: ictkb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ictkb" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ictkb:ictkb@localhost:5432/ictkb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests eval scripts
      - name: Content schema and rules
        run: ictkb validate
        env:
          EMBEDDING_PROVIDER: hash
      - name: Secret and personal data scan
        run: python scripts/scan_secrets.py
      - name: Tests
        run: pytest -q

  listener:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-listener
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: whatsapp-listener/package-lock.json
      - run: npm ci
      - run: npm test

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json
      - run: npm ci
      - run: npm test

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 4 --accept 200,201,202,204,403,429 --exclude-path content/.*/_extracted "content/**/*.md" "docs/**/*.md" README.md
          fail: false
