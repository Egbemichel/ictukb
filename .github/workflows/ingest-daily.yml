name: ingest-daily

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

# Automation switch: runs only when the repository variable ENABLE_AUTOMATION is 'true'
# (Settings > Secrets and variables > Actions > Variables), after the required secrets are set.
jobs:
  ingest:
    if: ${{ vars.ENABLE_AUTOMATION == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      KB_ENV: production
      EMBEDDING_PROVIDER: cohere
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Website
        run: ictkb crawl
      - name: Sheets (daily, semester and static tiers)
        run: ictkb sync-sheets --tier daily --tier semester --tier static
      - name: Remove expired posts
        run: ictkb notes-prune
