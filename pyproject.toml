[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ictkb"
version = "0.1.0"
description = "Knowledge base and retrieval API for ICT University chatbots"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "python-frontmatter>=1.1",
  "jsonschema>=4.21",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "markdownify>=0.12",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "pillow>=10.0"]
local-embeddings = ["fastembed>=0.3"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
ictkb = "ictkb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a PostgreSQL instance with pgvector (TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "E501"]
